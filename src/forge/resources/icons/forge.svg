<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Forge development placeholder icon. Approximates the brand guide mark;
       replace with the official vector export when it is available. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12305A"/>
      <stop offset="1" stop-color="#081A33"/>
    </linearGradient>
    <linearGradient id="outer" x1="47" y1="212" x2="209" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F74FF"/>
      <stop offset="0.45" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#20D7E8"/>
    </linearGradient>
    <linearGradient id="arm" x1="93" y1="0" x2="194" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#20D7E8"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="143" x2="0" y2="211" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B7FF4A"/>
      <stop offset="1" stop-color="#8EE03A"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#tile)"/>
  <rect x="17" y="17" width="222" height="222" rx="55" fill="none" stroke="#4DA3FF" stroke-opacity="0.28" stroke-width="2"/>
  <!-- Outer ribbon: top arm folding into the stem -->
  <polygon points="47,94 99,44 209,44 171,86 108,86 81,113 81,212 47,179" fill="url(#outer)"/>
  <!-- Fold shading on the stem face -->
  <polygon points="47,94 81,113 81,212 47,179" fill="#000000" fill-opacity="0.14"/>
  <!-- Inner ribbon: middle arm (sky to cyan) and lime leg -->
  <polygon points="93,122 112,103 194,103 156,143 93,143" fill="url(#arm)"/>
  <polygon points="93,143 127,143 127,179 93,211" fill="url(#leg)"/>
</svg>
